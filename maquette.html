<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gustora · Maquette de l'accueil</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;600;700;800&display=swap">
<style>
/* ---------- Couleurs « Argile & Safran » (DESIGN.md) ---------- */
:root{
  --bg:#FBF4E8; --tx:#2E1D14; --pr:#B3472B; --ac:#E2A325; --dx:#F2E0C6; --on:#FFFFFF; --onac:#2E1D14;
  --card:color-mix(in srgb,var(--bg) 55%,#fff);
  --display:"Young Serif", Georgia, serif;
  --body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --line:color-mix(in srgb,var(--tx) 12%,transparent);
  --shadow:0 16px 30px color-mix(in srgb,var(--tx) 20%,transparent);
  --soft:color-mix(in srgb,var(--tx) 74%,var(--bg));
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1D1410; --tx:#F5EADB; --pr:#E8835F; --ac:#F0B744; --dx:#3A2B21; --on:#1D1410; --onac:#1D1410;
    --card:color-mix(in srgb,var(--bg) 90%,#fff); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1D1410; --tx:#F5EADB; --pr:#E8835F; --ac:#F0B744; --dx:#3A2B21; --on:#1D1410; --onac:#1D1410;
  --card:color-mix(in srgb,var(--bg) 90%,#fff); color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 var(--body);
  padding-bottom:calc(110px + env(safe-area-inset-bottom));transition:background-color .4s,color .4s}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;line-height:1.12}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ac);outline-offset:3px}

/* ---------- Effet 78 : le courant d'épices du fond ---------- */
#graines{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.page{position:relative;z-index:1;max-width:1160px;margin:0 auto;padding:0 16px}

/* ---------- En-tête ---------- */
.top{display:flex;align-items:center;gap:10px;padding:18px 0 6px}
.top svg{width:40px;height:40px;flex:none}
.top b{font:400 1.6rem var(--display);flex:1}
/* Interrupteur jour / nuit (effet 27 de DESIGN.md) */
.sw{position:relative;width:64px;height:34px;border-radius:99px;border:2px solid color-mix(in srgb,var(--tx) 25%,transparent);
  background:var(--dx);cursor:pointer;padding:0;flex:none}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--ac);color:var(--onac);
  display:grid;place-items:center;font-style:normal;font-size:14px;line-height:1;transition:transform .45s cubic-bezier(.3,1.3,.5,1),background-color .4s}
.nuit .sw i{transform:translateX(30px);background:var(--tx);color:var(--bg)}

/* ---------- Phrase d'accueil + recherche ---------- */
.hello{padding:clamp(18px,4vw,40px) 0 18px}
.hello h1{font-size:clamp(2.1rem,6.2vw,4.1rem);max-width:17ch;letter-spacing:-.01em}
.search{display:flex;align-items:center;gap:10px;max-width:640px;margin-top:22px;padding:0 20px;height:58px;border-radius:99px;
  background:var(--card);border:1.5px solid color-mix(in srgb,var(--tx) 22%,transparent);box-shadow:0 6px 16px color-mix(in srgb,var(--tx) 8%,transparent)}
.search svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--tx);stroke-width:2;stroke-linecap:round}
.champ{position:relative;flex:1;min-width:0;display:flex}
.search input{flex:1;min-width:0;border:0;background:none;font-size:1.05rem;outline:none}
/* Effet 14 : texte qui s'écrit (posé par-dessus le champ, les clics passent au travers) */
.idee{position:absolute;inset:0;display:flex;align-items:center;pointer-events:none;font-size:1.05rem;color:var(--soft);white-space:nowrap;overflow:hidden}
.idee[hidden]{display:none}
.idee .cur{flex:none;width:2px;height:1.2em;margin-left:2px;background:var(--pr);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.search input::placeholder{color:var(--soft);opacity:1}
.search:focus-within{border-color:var(--pr)}

/* ---------- Carte vedette (effet 3 : carte en couches, l'effet star) + raccourcis ---------- */
.duo{display:grid;gap:16px;margin-top:22px}
@media (min-width:900px){ .duo{grid-template-columns:7fr 5fr;gap:22px;align-items:stretch} }
.vedette{position:relative;border-radius:22px;min-height:330px;color:var(--on);touch-action:pan-y;
  transition:transform .8s cubic-bezier(.2,.8,.2,1);box-shadow:var(--shadow);overflow:hidden;isolation:isolate;transform-style:preserve-3d}
@media (min-width:900px){ .vedette{min-height:380px} }
.vedette [data-depth]{transition:transform .8s cubic-bezier(.2,.8,.2,1)}
.ly-bg{position:absolute;inset:-24px;background:var(--pr);z-index:-2}
.ly-bg .sun{position:absolute;right:-40px;top:-40px;width:min(62%,300px);aspect-ratio:1;border-radius:50%;background:var(--ac)}
.ly-bg .ring{position:absolute;right:-82px;top:-82px;width:min(84%,400px);aspect-ratio:1;border-radius:50%;
  border:2px dashed color-mix(in srgb,var(--on) 35%,transparent)}
.ly-mid{position:absolute;right:clamp(14px,5%,40px);top:clamp(14px,6%,36px);font-size:clamp(4.2rem,13vw,8.5rem);line-height:1;z-index:-1;
  filter:drop-shadow(0 12px 14px color-mix(in srgb,#000 22%,transparent))}
.ly-top{position:relative;height:100%;min-height:inherit;display:grid;align-content:end;gap:10px;padding:clamp(18px,3.4vw,30px)}
.kick{font-weight:700;font-size:.95rem}
.vedette h2{font-size:clamp(1.7rem,3.6vw,2.6rem);max-width:13ch}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.bdg{background:var(--ac);color:var(--onac);font-weight:800;font-size:.8rem;border-radius:8px;padding:2px 8px}
.sea{background:var(--dx);color:var(--tx);font-weight:600;font-size:.8rem;border-radius:99px;padding:2px 10px}
.vedette .tm{background:color-mix(in srgb,var(--on) 18%,transparent);color:var(--on);font-weight:700;font-size:.8rem;border-radius:99px;padding:2px 10px}
.see{justify-self:start;margin-top:6px;border:2px solid var(--on);background:transparent;color:var(--on);border-radius:99px;
  padding:10px 20px;font-weight:700;cursor:pointer}

.raccourcis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0;padding:0;list-style:none}
.raccourcis li:last-child{grid-column:1/-1}
@media (min-width:900px){ .raccourcis{grid-template-columns:1fr;grid-auto-rows:1fr} .raccourcis li:last-child{grid-column:auto} }
.rac{width:100%;height:100%;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:18px;cursor:pointer;text-align:left;
  background:var(--card);border:1px solid var(--line);font:400 .98rem/1.2 var(--display);
  position:relative;overflow:hidden;isolation:isolate;transition:color .3s}
.rac .ic{width:36px;height:36px;flex:none;border-radius:50%;background:var(--dx);display:grid;place-items:center}
.rac .ic{transition:background-color .3s}
.rac svg{width:22px;height:22px;fill:none;stroke:var(--pr);stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:stroke .3s}
/* Effet 8 : le voile entre par le côté d'où arrive la souris */
.rac .voile{position:absolute;inset:0;z-index:-1;background:var(--pr);transform:translate(-101%,0);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.rac.on{color:var(--on)}
.rac.on .ic{background:color-mix(in srgb,var(--on) 20%,transparent)}
.rac.on svg{stroke:var(--on)}
@media (min-width:900px){ .rac{font-size:1.2rem;padding:12px 18px} .rac .ic{width:48px;height:48px} }

/* ---------- Cartes recette (effet 2 : carte qui penche) ---------- */
.bloc{margin-top:clamp(30px,5vw,48px)}
.bloc h2{font-size:clamp(1.5rem,3vw,2rem);margin-bottom:14px}
.cartes{display:grid;gap:14px}
@media (min-width:620px){ .cartes{grid-template-columns:1fr 1fr} }
@media (min-width:980px){ .cartes{grid-template-columns:repeat(3,1fr);gap:18px} }
.tilt{touch-action:pan-y;transition:transform .7s cubic-bezier(.2,.8,.2,1);border-radius:18px}
.rc{position:relative;display:grid;grid-template-columns:100px 1fr;min-height:120px;border-radius:18px;overflow:hidden;
  background:var(--card);border:1px solid var(--line);box-shadow:0 8px 18px color-mix(in srgb,var(--tx) 10%,transparent)}
.rc .img{background:var(--dx);display:grid;place-items:center;font-size:2.8rem;line-height:1}
.rc .body{padding:12px 14px;display:grid;gap:3px;align-content:center}
.rc h3{font-size:1.12rem;padding-right:34px}
.rc .z{font-size:.86rem;font-weight:600;color:var(--soft)}
.rc .meta{font-size:.86rem;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;margin-top:3px}
.note{font-size:.85rem;color:var(--soft);margin:14px 0 0}

/* ♥ (effet 13 : petit « pop ») */
.heart{position:absolute;right:4px;top:4px;border:0;background:none;font-size:1.5rem;line-height:1;cursor:pointer;padding:8px;
  color:color-mix(in srgb,var(--tx) 35%,transparent)}
.heart.on{color:var(--pr)}
.heart.pop{animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1)}}

/* ---------- Barre d'onglets (effet 42 : onglets qui glissent) ---------- */
.tabbar{position:fixed;z-index:5;left:50%;bottom:calc(10px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(520px,calc(100% - 20px));
  display:grid;grid-template-columns:repeat(5,1fr);padding:5px;border-radius:22px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.tabbar button{position:relative;z-index:1;border:0;background:none;display:grid;justify-items:center;gap:2px;padding:7px 0;min-width:0;cursor:pointer;
  font-size:.68rem;font-weight:600;color:var(--soft);transition:color .3s}
.tabbar svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.tabbar button[aria-selected="true"]{color:var(--on)}
.tabbar .pill{position:absolute;top:5px;bottom:5px;left:0;border-radius:17px;background:var(--pr);
  transition:transform .45s cubic-bezier(.3,1.2,.5,1),width .45s}

/* Petit message (♥ ajouté / retiré) */
.toast{position:fixed;z-index:6;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translate(-50%,12px);opacity:0;
  background:var(--tx);color:var(--bg);font-weight:700;font-size:.9rem;padding:9px 16px;border-radius:99px;pointer-events:none;
  transition:transform .35s,opacity .35s}
.toast.show{transform:translate(-50%,0);opacity:1}

/* Les recettes ne se chargent pas */
.erreur{margin-top:22px;padding:20px;border-radius:18px;background:var(--card);border:1px solid var(--line);display:grid;gap:12px;justify-items:start}
.erreur button{border:0;border-radius:99px;background:var(--pr);color:var(--on);font-weight:700;padding:10px 20px;cursor:pointer}

/* « Réduire les animations » : rien ne bouge pour décorer */
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<canvas id="graines" aria-hidden="true"></canvas>

<div class="page">
  <header class="top">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <path d="M47 17A21 21 0 1 0 53 32H38" fill="none" stroke="var(--pr)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="32" cy="32" r="6.5" fill="var(--ac)"/>
    </svg>
    <b id="nom"></b>
    <button class="sw" id="sw" type="button"><i aria-hidden="true"></i></button>
  </header>

  <main>
    <section class="hello">
      <h1 id="phrase"></h1>
      <form class="search" role="search" onsubmit="return false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L20 20"/></svg>
        <span class="champ"><input id="recherche" type="search" enterkeyhint="search"><span class="idee" id="idee" aria-hidden="true" hidden><span class="t"></span><span class="cur"></span></span></span>
      </form>
    </section>

    <div id="contenu"></div>
  </main>
</div>

<nav class="tabbar" id="onglets" role="tablist"><span class="pill"></span></nav>
<span class="toast" id="toast" role="status"></span>

<script src="textes.js"></script>
<script>
const $ = id => document.getElementById(id);
const T = TEXTES, A = T.accueil;
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Un emoji par plat (en attendant les images de la mission 13) ---------- */
const EMOJI = {
  "auvergne-rhone-alpes-salade-lyonnaise":"🥗", "bretagne-crepes-froment":"🥞", "grand-est-tarte-flambee":"🫓",
  "inde-dal-lentilles-corail":"🍛", "italie-spaghetti-carbonara":"🍝", "japon-gyozas-porc-chou":"🥟",
  "maroc-couscous-poulet-legumes":"🍲", "mexique-tacos-carnitas":"🌮", "nouvelle-aquitaine-poulet-basquaise":"🍗",
  "provence-alpes-cote-d-azur-ratatouille":"🍆"
};
const emoji = r => EMOJI[r.id] || "🍽️";

/* ---------- Petites icônes (trait fin, couleur du texte) ---------- */
const ICONES = {
  accueil:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
  explorer:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/>',
  frigo:'<rect x="6" y="2.5" width="12" height="19" rx="2"/><path d="M6 10h12M9 6v2M9 13v3"/>',
  favoris:'<path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/>',
  courses:'<path d="M4 9h16l-1.5 10a2 2 0 0 1-2 1.7h-9a2 2 0 0 1-2-1.7zM8 9l4-6 4 6"/>',
  france:'<path d="M9 3l5 1.5 4.5 3.5-1 4.5 2 4-3.5 4-5-1.5-4 2-3-3.5 1-5L3 8.5 6 4.5z"/>',
  monde:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.2 3 14.8 0 18M12 3c-3 3.2-3 14.8 0 18"/>',
  budget:'<circle cx="12" cy="12" r="9"/><path d="M15.5 8.5a4.5 4.5 0 1 0 0 7M7 11h6.5M7 13.5h6.5"/>',
  temps:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M10 2.5h4"/>'
};
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONES[k]}</svg>`;

/* ---------- Mise en forme : temps, prix, saison du jour ---------- */
function duree(min){ const h=Math.floor(min/60), m=min%60; return h ? `${h} h${m?' '+String(m).padStart(2,'0'):''}` : `${m} min`; }
function prix(e){ return '~' + e.toLocaleString('fr-FR',{minimumFractionDigits:e%1?2:0, maximumFractionDigits:2}) + ' € ' + T.parPersonne; }
function saisonDuJour(d){ const m=d.getMonth(); return m<2||m===11 ? 'hiver' : m<5 ? 'printemps' : m<8 ? 'été' : 'automne'; }
const saisons = r => r.saisons.map(s=>`<span class="sea">${T.saisons[s]}</span>`).join('');

/* ---------- Les textes fixes de la page ---------- */
$('nom').textContent = T.appNom;
$('phrase').textContent = A.phrase;
$('recherche').placeholder = A.recherche;
$('recherche').setAttribute('aria-label', A.recherche);

/* ---------- Jour / nuit : suit le téléphone, l'interrupteur le change (gardé dans le navigateur) ---------- */
const sombre = matchMedia('(prefers-color-scheme: dark)');
let choixTheme = null;
try { choixTheme = localStorage.getItem('gustora-theme'); } catch(e){}
function appliquerTheme(){
  const nuit = choixTheme ? choixTheme==='dark' : sombre.matches;
  if (choixTheme) document.documentElement.dataset.theme = choixTheme; else delete document.documentElement.dataset.theme;
  document.documentElement.classList.toggle('nuit', nuit);
  $('sw').querySelector('i').textContent = nuit ? '☾' : '☀';
  $('sw').setAttribute('aria-label', nuit ? T.modeJour : T.modeNuit);
  couleurs();
}
$('sw').addEventListener('click',()=>{
  choixTheme = document.documentElement.classList.contains('nuit') ? 'light' : 'dark';
  try { localStorage.setItem('gustora-theme', choixTheme); } catch(e){}
  appliquerTheme();
});
sombre.addEventListener('change', appliquerTheme);

/* ---------- Barre d'onglets ---------- */
const CLES = ['accueil','explorer','frigo','favoris','courses'];
$('onglets').insertAdjacentHTML('beforeend', T.onglets.map((t,i)=>
  `<button type="button" role="tab" aria-selected="${i===0}">${svg(CLES[i])}${t}</button>`).join(''));
(function(){ const bar=$('onglets'), pill=bar.querySelector('.pill'), btns=[...bar.querySelectorAll('button')];
  function sel(b){ btns.forEach(x=>x.setAttribute('aria-selected',String(x===b)));
    pill.style.width=b.offsetWidth+'px'; pill.style.transform=`translateX(${b.offsetLeft}px)`; }
  btns.forEach(b=>b.addEventListener('click',()=>sel(b)));
  new ResizeObserver(()=>sel(btns.find(b=>b.getAttribute('aria-selected')==='true'))).observe(bar); })();

/* ---------- Le contenu, fabriqué avec les vraies recettes ---------- */
function carte(r){ return `<div class="tilt js-tilt" data-max="8"><article class="rc">
  <div class="img" aria-hidden="true">${emoji(r)}</div>
  <div class="body"><h3>${r.nom}</h3><span class="z">${r.zone}</span>
    <span class="meta"><span>⏱ ${duree(r.tempsTotal)}</span><span>${prix(r.prixParPersonne)}</span><span class="bdg">${r.budget}</span></span></div>
  <button class="heart" type="button" aria-pressed="false" aria-label="${T.favoriAjouter} : ${r.nom}">♥</button></article></div>`; }

function vedette(r, saison){ return `<div class="vedette js-tilt" data-max="9">
  <div class="ly-bg" data-depth="0.4"><span class="ring"></span><span class="sun"></span></div>
  <div class="ly-mid" data-depth="1.3" aria-hidden="true">${emoji(r)}</div>
  <div class="ly-top" data-depth="2.2">
    <span class="kick">${A.vedette} · ${T.saisons[saison]}</span>
    <h2>${r.nom}</h2>
    <span class="badges"><span class="bdg">${r.budget}</span><span class="tm">⏱ ${duree(r.tempsTotal)}</span>${saisons(r)}</span>
    <button class="see" type="button">${A.voirRecette}</button>
  </div></div>`; }

const RACCOURCIS = ['france','monde','frigo','budget','temps'];
const raccourcis = () => `<ul class="raccourcis">` + A.raccourcis.map((t,i)=>
  `<li><button class="rac" type="button"><span class="voile"></span><span class="ic">${svg(RACCOURCIS[i])}</span>${t}</button></li>`).join('') + `</ul>`;

function afficher(index){
  const auj = new Date(), saison = saisonDuJour(auj);
  // La recette vedette : tirée parmi celles de la saison, elle change chaque jour.
  let choix = index.recettes.filter(r=>r.saisons.includes(saison));
  if (!choix.length) choix = index.recettes;
  const jour = Math.floor(new Date(auj.getFullYear(),auj.getMonth(),auj.getDate()) / 864e5);
  const star = choix[jour % choix.length];
  // Les dernières ajoutées : la fin du sommaire, sans répéter la vedette.
  const dernieres = index.recettes.slice().reverse().filter(r=>r!==star).slice(0,6);
  $('contenu').innerHTML = `<div class="duo">${vedette(star, saison)}${raccourcis()}</div>
    <section class="bloc"><h2>${A.dernieres}</h2><div class="cartes">${dernieres.map(carte).join('')}</div>
    <p class="note">${T.prixEstime}</p></section>`;
  brancherEffets(); ecrireIdees(index);
}

function charger(){
  fetch('recettes/index.json').then(r=>{ if(!r.ok) throw 0; return r.json(); }).then(afficher).catch(()=>{
    $('contenu').innerHTML = `<div class="erreur" role="alert"><p>${T.erreurChargement}</p><button type="button" id="retry">${T.reessayer}</button></div>`;
    $('retry').addEventListener('click', charger);
  });
}

/* ---------- Effets 3 et 2 : la carte penche (souris, ou doigt qui glisse à l'horizontale) ---------- */
function brancherEffets(){
  if (!reduce) document.querySelectorAll('.js-tilt').forEach(el=>{
    const max=+el.dataset.max, layers=[...el.querySelectorAll('[data-depth]')];
    function move(e){ const r=el.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
      el.style.transition='transform .15s linear';
      el.style.transform=`perspective(900px) rotateX(${(-y*max).toFixed(2)}deg) rotateY(${(x*max).toFixed(2)}deg)`;
      layers.forEach(l=>{ const d=+l.dataset.depth; l.style.transition='transform .15s linear';
        l.style.transform=`translate3d(${(x*d*12).toFixed(1)}px,${(y*d*12).toFixed(1)}px,0)`; }); }
    function reset(){ el.style.transition=''; el.style.transform=''; layers.forEach(l=>{ l.style.transition=''; l.style.transform=''; }); }
    el.addEventListener('pointermove',move); el.addEventListener('pointerleave',reset); el.addEventListener('pointercancel',reset);
    el.addEventListener('pointerup',e=>{ if(e.pointerType!=='mouse') reset(); });
  });
  // Effet 8 : voile qui suit la direction (souris) ; au doigt, il monte pendant l'appui
  document.querySelectorAll('.rac').forEach(b=>{
    const voile=b.querySelector('.voile');
    function cote(e){ const r=b.getBoundingClientRect(), x=(e.clientX-r.left)/r.width-.5, y=(e.clientY-r.top)/r.height-.5;
      return Math.abs(x)>Math.abs(y) ? (x>0?'101%,0':'-101%,0') : (y>0?'0,101%':'0,-101%'); }
    function entrer(depuis){ voile.style.transition='none'; voile.style.transform=`translate(${depuis})`; voile.offsetWidth;
      voile.style.transition=''; voile.style.transform='translate(0,0)'; b.classList.add('on'); }
    function sortir(vers){ voile.style.transform=`translate(${vers})`; b.classList.remove('on'); }
    b.addEventListener('pointerenter',e=>{ if(e.pointerType==='mouse') entrer(cote(e)); });
    b.addEventListener('pointerleave',e=>{ if(e.pointerType==='mouse') sortir(cote(e)); });
    b.addEventListener('pointerdown',e=>{ if(e.pointerType!=='mouse') entrer('0,101%'); });
    ['pointerup','pointercancel'].forEach(n=>b.addEventListener(n,e=>{ if(e.pointerType!=='mouse') setTimeout(()=>sortir('0,101%'),250); }));
  });
  // Effet 13 : le ♥ fait « pop » (juste pour voir : les vrais favoris arrivent à la mission 10)
  let tm;
  document.querySelectorAll('.heart').forEach(h=>h.addEventListener('click',()=>{
    const on=!h.classList.contains('on'), nom=h.closest('.rc').querySelector('h3').textContent;
    h.classList.toggle('on',on); h.setAttribute('aria-pressed',String(on));
    h.setAttribute('aria-label',`${on?T.favoriRetirer:T.favoriAjouter} : ${nom}`);
    h.classList.remove('pop'); h.offsetWidth; h.classList.add('pop');
    $('toast').textContent = on ? T.favoriAjoute : T.favoriRetire; $('toast').classList.add('show');
    clearTimeout(tm); tm=setTimeout(()=>$('toast').classList.remove('show'),1800);
  }));
}

/* ---------- Effet 78 : le courant d'épices du fond (bouge tout seul, tourbillonne sous la souris ou le doigt) ---------- */
const cv=$('graines'), ctx=cv.getContext('2d'), P={x:-999,y:-999};
let grains=[], W=0, H=0, raf=0, C={};
function couleurs(){ const s=getComputedStyle(document.documentElement);
  C={pr:s.getPropertyValue('--pr').trim(), ac:s.getPropertyValue('--ac').trim()}; ctx.clearRect(0,0,W,H); if(reduce) immobile(); }
function taille(){ const d=Math.min(devicePixelRatio||1,2); W=innerWidth; H=innerHeight; cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0);
  const n=Math.min(650, Math.round(W*H/1700));
  grains=Array.from({length:n},(_,i)=>({x:Math.random()*W, y:Math.random()*H, safran:i%3===0}));
  if (reduce) immobile(); }
function immobile(){ // « Réduire les animations » : les grains restent posés, sans bouger
  if (!C.pr) return; ctx.clearRect(0,0,W,H); ctx.globalAlpha=.45;
  for(const q of grains){ ctx.fillStyle=q.safran?C.ac:C.pr; ctx.beginPath(); ctx.arc(q.x,q.y,1.4,0,7); ctx.fill(); }
  ctx.globalAlpha=1; }
function boucle(t){
  // On efface un peu l'image d'avant : les grains laissent une courte traînée, comme de la poudre dans l'air.
  ctx.globalCompositeOperation='destination-out'; ctx.fillStyle='rgba(0,0,0,.12)'; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='source-over';
  const terre=new Path2D(), safran=new Path2D();
  for(const q of grains){
    let a=(Math.sin(q.x*.006+t*.00018)+Math.cos(q.y*.007-t*.00012))*Math.PI, v=.9;
    const dx=q.x-P.x, dy=q.y-P.y, d=Math.hypot(dx,dy);
    if (d<120){ a=Math.atan2(dy,dx)+Math.PI/2+.35; v=1.6+(120-d)/50; }   // le tourbillon
    const ox=q.x, oy=q.y; q.x+=Math.cos(a)*v; q.y+=Math.sin(a)*v;
    if (q.x<0||q.x>W||q.y<0||q.y>H){ q.x=Math.random()*W; q.y=Math.random()*H; continue; }
    const trait=q.safran?safran:terre; trait.moveTo(ox,oy); trait.lineTo(q.x,q.y);
  }
  ctx.lineWidth=2; ctx.lineCap='round';
  ctx.globalAlpha=.6; ctx.strokeStyle=C.pr; ctx.stroke(terre);
  ctx.globalAlpha=.8; ctx.strokeStyle=C.ac; ctx.stroke(safran); ctx.globalAlpha=1;
  raf = document.hidden ? 0 : requestAnimationFrame(boucle);
}
function demarrer(){ if(!raf && !reduce && !document.hidden) raf=requestAnimationFrame(boucle); }
document.addEventListener('visibilitychange', demarrer);   // en pause quand l'onglet est caché (la batterie dit merci)
const suivre=e=>{ P.x=e.clientX; P.y=e.clientY; };
addEventListener('pointermove',suivre,{passive:true}); addEventListener('pointerdown',suivre,{passive:true});
const lacher=()=>{ P.x=P.y=-999; };
['pointercancel','blur'].forEach(n=>addEventListener(n,lacher));
document.addEventListener('pointerleave',lacher);
addEventListener('pointerup',e=>{ if(e.pointerType!=='mouse') lacher(); });
// Sur iPhone, la barre d'adresse qui se cache change un peu la hauteur : on ne recommence que si l'écran change vraiment.
addEventListener('resize',()=>{ if(Math.abs(innerWidth-W)>40 || Math.abs(innerHeight-H)>160) taille(); });

/* ---------- Effet 14 : dans la recherche, des idées de recettes s'écrivent toutes seules ---------- */
function ecrireIdees(index){
  const champ=$('recherche'), ecran=$('idee'), txt=ecran.querySelector('.t');
  if (reduce) return;
  const idees=[A.recherche, ...index.recettes.map(r=>r.nom).sort(()=>Math.random()-.5).slice(0,4)];
  let i=0, n=0, efface=false, tm=0, visible=true;
  const libre=()=>!champ.value && document.activeElement!==champ;
  function pas(){
    clearTimeout(tm);
    if (!visible || !libre()){ ecran.hidden=true; champ.placeholder=A.recherche; return; }
    ecran.hidden=false; champ.placeholder='';
    const mot=idees[i];
    if (!efface){ txt.textContent=mot.slice(0,++n); if(n>=mot.length){ efface=true; tm=setTimeout(pas,2000); return; } tm=setTimeout(pas,55); }
    else { txt.textContent=mot.slice(0,--n); if(n<=0){ efface=false; i=(i+1)%idees.length; tm=setTimeout(pas,350); return; } tm=setTimeout(pas,22); }
  }
  champ.addEventListener('focus',pas); champ.addEventListener('blur',pas); champ.addEventListener('input',pas);
  new IntersectionObserver(es=>{ visible=es[0].isIntersecting; pas(); }).observe(champ);
  pas();
}

taille(); appliquerTheme(); demarrer(); charger();
</script>
