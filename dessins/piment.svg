    <path d="M56 44c10 4 16 14 18 24" fill="none" stroke="var(--bg,#FAF6F1)" stroke-width="4" stroke-linecap="round" opacity=".55"/>
    <path d="M45 35c-4-8-2-16 6-22M37 39c6-6 14-6 18 0" fill="none" stroke="var(--fx,#2A9D5C)" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
