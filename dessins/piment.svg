<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-hidden="true">
  <style>
    .piment{transform-box:fill-box;transform-origin:50% 100%;animation:danse 1.4s ease-in-out infinite alternate}
    @keyframes danse{0%{transform:rotate(-10deg)}50%{transform:translateY(-8px) rotate(2deg) scaleY(1.05)}100%{transform:rotate(10deg)}}
