<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" aria-hidden="true">
  <style>
    svg *{transform-box:fill-box}
    .four{transform-origin:50% 100%;animation:four 2.4s ease-in-out infinite alternate}
    .spirale{transform-origin:center;animation:spirale 1.2s linear infinite}
    .brin{transform-origin:50% 0%;animation:brin 1.2s ease-in-out infinite alternate}
    @keyframes four{from{transform:rotate(-9deg)}to{transform:rotate(9deg)}}
    @keyframes spirale{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.82)}}
    @keyframes brin{from{transform:rotate(8deg)}to{transform:rotate(-8deg)}}
    @media (prefers-reduced-motion:reduce){.four,.spirale,.brin{animation:none}}
  </style>
  <g class="four">
    <g class="brin" fill="none" stroke="var(--ac,#F2B705)" stroke-width="5" stroke-linecap="round"><path d="M40 52q-8 18 2 36"/><path d="M80 52q8 16 0 34"/></g>
    <g class="spirale"><path d="M34 44a26 13 0 1 0 52 0a20 10 0 1 0-40 0a14 7 0 1 0 28 0" fill="none" stroke="var(--ac,#F2B705)" stroke-width="5" stroke-linecap="round"/></g>
    <g fill="var(--tx,#1E1A17)"><rect x="56" y="62" width="8" height="52" rx="4"/><path d="M47 14h4v26h4V14h4v26h2V14h4v26h4V14h4v32q0 14-13 14q-13 0-13-14z"/></g>
  </g>
</svg>
